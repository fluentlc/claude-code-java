# ─── Spring Boot ─────────────────────────────────────────────────────────────
server.port=8080
spring.application.name=claude-code-java

# ─── 模型配置 ─────────────────────────────────────────────────────────────────
# 所有模型配置（API Key / Base URL / Model ID）通过 Web Playground「设置」菜单填写，
# 保存在服务端 .models/models.json 文件中。
# 不再支持通过 application.properties 或环境变量配置模型信息。

# ─── 调试 ─────────────────────────────────────────────────────────────────────
# 设为 true 打印完整 API 请求/响应报文（排查问题用）
# DEBUG_PRINT_PAYLOAD=false

#---
# CLI 模式：禁用 Web Server（spring.profiles.active=cli 时生效）
spring.config.activate.on-profile=cli
spring.main.web-application-type=none
